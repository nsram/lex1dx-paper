name: CI

on:
  push:
  pull_request:

jobs:
  cpp:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S cpp -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Check fixtures
        run: python fixtures/gen_fixtures.py
      - name: Install
        run: python -m pip install ./python pytest
      - name: Test (builds lex_cli with CMake for the bit-identity check)
        run: python -m pytest python/tests -q

  scala:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check fixtures
        run: python fixtures/gen_fixtures.py
      - name: Test
        working-directory: scala
        run: sbt -batch test

  r:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      LEX1D_FIXTURES: ${{ github.workspace }}/fixtures
      _R_CHECK_FORCE_SUGGESTS_: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::rcmdcheck
          needs: check
      - name: Copy the C++ core into r/src (R CMD build does not run configure)
        working-directory: r
        shell: bash
        run: sh tools/sync_core.sh
      # error-on "error": -ffp-contract=off in src/Makevars is a known WARNING ("non-portable flag")
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r
          error-on: '"error"'
